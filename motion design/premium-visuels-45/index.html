<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: #0D0D0D; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0D0D0D; }
      [data-composition-id="main"] > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- Images fixes : une scène figée d'une seconde par image, exportée par snapshot au milieu de la scène -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1350" data-fps="30">
      <div id="h-01" data-composition-id="img-01" data-composition-src="compositions/frames/01.html" data-start="0" data-duration="1" data-track-index="1" data-width="1080" data-height="1350"></div>
      <div id="h-02" data-composition-id="img-02" data-composition-src="compositions/frames/02.html" data-start="1" data-duration="1" data-track-index="1" data-width="1080" data-height="1350"></div>
      <div id="h-03" data-composition-id="img-03" data-composition-src="compositions/frames/03.html" data-start="2" data-duration="1" data-track-index="1" data-width="1080" data-height="1350"></div>
      <div id="h-04" data-composition-id="img-04" data-composition-src="compositions/frames/04.html" data-start="3" data-duration="1" data-track-index="1" data-width="1080" data-height="1350"></div>
      <div id="h-05" data-composition-id="img-05" data-composition-src="compositions/frames/05.html" data-start="4" data-duration="1" data-track-index="1" data-width="1080" data-height="1350"></div>
      <div id="h-06" data-composition-id="img-06" data-composition-src="compositions/frames/06.html" data-start="5" data-duration="1" data-track-index="1" data-width="1080" data-height="1350"></div>
      <div id="h-07" data-composition-id="img-07" data-composition-src="compositions/frames/07.html" data-start="6" data-duration="1" data-track-index="1" data-width="1080" data-height="1350"></div>
      <div id="h-08" data-composition-id="img-08" data-composition-src="compositions/frames/08.html" data-start="7" data-duration="1" data-track-index="1" data-width="1080" data-height="1350"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
