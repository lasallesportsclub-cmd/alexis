<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #F7F5F3; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F7F5F3; }
      [data-composition-id="main"] > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- 4 stories de 5 s : images fixes prises à la fin de chaque scène, vidéos découpées dans le rendu -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920" data-fps="30">
      <div id="h-s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="5" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="h-s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="5" data-duration="5" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="h-s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="10" data-duration="5" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="h-s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="15" data-duration="5" data-track-index="1" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
