<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0D0D0D; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0D0D0D; }
      [data-composition-id="main"] > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- Carte cadeau LA SALLE, accroche A : 5 scènes en coupes franches, 12 s, 30 i/s, 120 BPM -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920" data-fps="30">
      <div id="h-s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="2" data-track-index="1" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="h-s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="2" data-duration="4.5" data-track-index="2" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="h-s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="6.5" data-duration="0.5" data-track-index="1" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="h-s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="7" data-duration="2" data-track-index="2" data-width="1080" data-height="1920" style="z-index:4"></div>
      <div id="h-s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="9" data-duration="3" data-track-index="1" data-width="1080" data-height="1920" style="z-index:5"></div>
      <audio id="musique" src="assets/audio/musique.wav" data-start="0" data-duration="12" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
