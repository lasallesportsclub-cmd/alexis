/* LA SALLE · Option Premium · atomes de la charte « Le Trait Oblique » v2 (source unique : frame.md) */
@font-face { font-family: "Barlow Condensed"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 800; font-style: normal; font-display: block; src: url("assets/fonts/barlow-condensed-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 800; font-style: italic; font-display: block; src: url("assets/fonts/barlow-condensed-latin-800-italic.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 900; font-style: normal; font-display: block; src: url("assets/fonts/barlow-condensed-latin-900-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 900; font-style: italic; font-display: block; src: url("assets/fonts/barlow-condensed-latin-900-italic.woff2") format("woff2"); }
@font-face { font-family: "DM Sans"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/dm-sans-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "DM Sans"; font-weight: 500; font-style: normal; font-display: block; src: url("assets/fonts/dm-sans-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "DM Sans"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/dm-sans-latin-700-normal.woff2") format("woff2"); }

.fr {
  --canvas: #0D0D0D; --text: #F4F1EC; --gold: #B8A07E; --surface: #222222;
  --muted: rgba(244,241,236,0.62); --ghost: rgba(184,160,126,0.16); --hair: rgba(244,241,236,0.18);
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: var(--canvas); color: var(--text);
  font-family: "Barlow Condensed", sans-serif; font-kerning: normal;
}
.fr.p45 { height: 1350px; }
.fr * { margin: 0; padding: 0; box-sizing: border-box; }
.fr .a { position: absolute; }

/* Typographie */
.fr .disp  { font-weight: 900; font-size: 168px; line-height: .86; letter-spacing: -.01em; text-transform: uppercase; white-space: nowrap; }
.fr .h1    { font-weight: 900; font-size: 112px; line-height: .9;  letter-spacing: -.005em; text-transform: uppercase; white-space: nowrap; }
.fr .h2    { font-weight: 800; font-size: 76px;  line-height: .95; text-transform: uppercase; white-space: nowrap; }
.fr .label { font-weight: 800; font-style: italic; font-size: 44px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; line-height: 1; }
.fr .qual  { font-weight: 800; font-size: 36px; letter-spacing: .03em; text-transform: uppercase; line-height: 1.15; white-space: nowrap; }
.fr .body  { font-family: "DM Sans", sans-serif; font-weight: 500; font-size: 36px; line-height: 1.3; }
.fr .num   { font-variant-numeric: tabular-nums; }
.fr .gold  { color: var(--gold); }
.fr .muted { color: var(--muted); }

/* Pastille or, extrémités coupées à 0,42 (64 px de haut → 27 px) */
.fr .pastille {
  height: 64px; padding: 0 46px; background: var(--gold); color: var(--canvas);
  font-weight: 800; font-style: italic; font-size: 36px; letter-spacing: .02em; text-transform: uppercase;
  display: flex; align-items: center; white-space: nowrap;
  clip-path: polygon(27px 0, 100% 0, calc(100% - 27px) 100%, 0 100%);
}

/* Bande : surface #222, extrémité droite coupée à 0,42, filet or sur le bord d'attaque (style inline : --h, --d = 0.42 × h) */
.fr .bande { background: var(--surface); clip-path: polygon(0 0, 100% 0, calc(100% - var(--d)) 100%, 0 100%); }
.fr .filet { background: var(--gold); clip-path: polygon(calc(100% - 6.5px) 0, 100% 0, calc(100% - var(--d)) 100%, calc(100% - var(--d) - 6.5px) 100%); }
.fr .bande .label { position: absolute; left: 36px; top: 50%; transform: translateY(-52%); }

/* « + » Premium : SVG deux barres, barre verticale penchée à 0,42 */
.fr .plus { fill: var(--gold); overflow: visible; }

/* Panneau des mentions : fond opaque, DM Sans 500 40 px */
.fr .mention {
  left: 108px; width: 864px; background: var(--surface); color: var(--text);
  font-family: "DM Sans", sans-serif; font-weight: 500; font-size: 40px; line-height: 1.18; letter-spacing: -.012em;
  padding: 8px 22px;
}

/* Grain fin, gris, en incrustation : garde la valeur moyenne du fond (#0D0D0D) ; amplitude ≈ ±0,014 */
.fr::after {
  content: "";
  position: absolute; inset: 0; pointer-events: none; opacity: .7; mix-blend-mode: overlay; z-index: 90;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n' color-interpolation-filters='sRGB'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}


.layer { position: absolute; inset: 0; }
.mask { position: absolute; overflow: hidden; padding: 0.2em 0.06em 0.08em 0; margin-top: -0.2em; }
.mask > div { display: block; }
.fr.ov { background: transparent; }
.fr.ov::after { display: none; }

        #root { position: absolute; inset: 0; }

<div id="a2-b1" class="layer"><div id="a2-b1c" class="layer"><div class="a bande " style="left:72px;top:460px;width:936px;height:530px;--d:222.6px"></div><div class="a filet " style="left:72px;top:460px;width:936px;height:530px;--d:222.6px"></div><div id="a2-lab" class="layer"><div class="a label" style="left:108px;top:498px;"><span class="gold">01</span>  FONTAINE À BOISSON SPORTIVE</div></div></div></div><div id="a2-b2" class="layer"><div class="a bande " style="left:72px;top:644px;width:936px;height:160px;--d:67.2px"><div class="label" style=""><span class="gold">02</span>  ANALYSE 3D</div></div><div class="a filet " style="left:72px;top:644px;width:936px;height:160px;--d:67.2px"></div></div><div id="a2-b3" class="layer"><div class="a bande " style="left:72px;top:828px;width:936px;height:160px;--d:67.2px"><div class="label" style=""><span class="gold">03</span>  SALLE DE POSING <span class="muted">· BIENTÔT</span></div></div><div class="a filet " style="left:72px;top:828px;width:936px;height:160px;--d:67.2px"></div></div><svg id="a2-clock" class="a" style="left:648px;top:528px;width:224px;height:224px" viewBox="0 0 224 224"><circle id="a2-clock-c" cx="112.0" cy="112.0" r="92" fill="none" stroke="rgba(244,241,236,0.18)" stroke-width="4" stroke-dasharray="578.1" transform="rotate(-90 112.0 112.0)"/><path id="a2-clock-a" d="M 112.0 20.0 A 92 92 0 0 1 112.0 204.0" fill="none" stroke="#B8A07E" stroke-width="15" stroke-dasharray="289.0"/><g id="a2-clock-n"><line x1="112.0" y1="112.0" x2="112.0" y2="46" stroke="#B8A07E" stroke-width="9"/></g><circle cx="112.0" cy="112.0" r="11" fill="#B8A07E"/></svg><div id="a2-g1" class="mask" style="left:108px;top:790px"><div id="a2-g1-t" class="disp" style="font-size:140px">UNE BOISSON</div></div><div id="a2-g2a" class="mask" style="left:108px;top:740px"><div id="a2-g2a-t" class="h1" style="">TOUTES LES</div></div><div id="a2-g2b" class="mask" style="left:108px;top:841px"><div id="a2-g2b-t" class="disp" style="font-size:140px"><span class="gold">30 MINUTES.</span></div></div>

      <script>

      const tl = gsap.timeline({ paused: true });
      // Coupes sèches : 1 ms (une durée nulle appliquerait l'état final dès la création)
      const show = (s, t) => tl.fromTo(s, { visibility: "hidden" }, { visibility: "visible", duration: 0.001, ease: "none", immediateRender: true }, t);
      const hide = (s, t) => tl.fromTo(s, { visibility: "visible" }, { visibility: "hidden", duration: 0.001, ease: "none", immediateRender: false }, t);
      // Le masque reste masqué jusqu'à l'entrée de sa ligne (aucun texte en attente dans la page)
      const fall = (s, t, d = 0.18) => { show(s.replace(/-t$/, ""), t); tl.fromTo(s, { yPercent: 118 }, { yPercent: 0, duration: d, ease: "power4.out" }, t); };
      const slam = (s, t, k = 1.28) => { show(s, t); tl.fromTo(s, { scale: k }, { scale: 1, duration: 0.16, ease: "power4.out" }, t); };
      const wipe = (s, t, d = 0.22) => tl.fromTo(s, { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: d, ease: "power3.out" }, t);
      const drop = (s, t, d = 0.2) => tl.fromTo(s, { clipPath: "inset(0px 0px 100% 0px)" }, { clipPath: "inset(0px 0px 0% 0px)", duration: d, ease: "power2.out" }, t);
      const shake = (s, t) => tl.to(s, { keyframes: [{ x: 7, y: -5, duration: 1 / 30 }, { x: -5, y: 4, duration: 1 / 30 }, { x: 0, y: 0, duration: 1 / 30 }], ease: "none" }, t);


      // Le trait ouvre l'écran en 3 bandes (01, 02, 03), décalées de 0,06 s
      tl.fromTo("#a2-b1", { x: -560 }, { x: 0, duration: 0.2, ease: "power3.out" }, 0);
      tl.fromTo("#a2-b2", { x: -700 }, { x: 0, duration: 0.2, ease: "power3.out" }, 0.0);
      tl.fromTo("#a2-b3", { x: -840 }, { x: 0, duration: 0.2, ease: "power3.out" }, 0.0);
      // La bande 01 s'ouvre, 02 et 03 sortent
      tl.fromTo("#a2-b1c", { clipPath: "inset(460px 0px 1300px 0px)" }, { clipPath: "inset(460px 0px 930px 0px)", duration: 0.26, ease: "power3.out" }, 0.469);
      tl.fromTo("#a2-lab", { y: 19 }, { y: 0, duration: 0.26, ease: "power3.out" }, 0.469);
      tl.fromTo("#a2-b2", { x: 0 }, { x: 1150, duration: 0.2, ease: "power3.in", immediateRender: false }, 0.469);
      tl.fromTo("#a2-b3", { x: 0 }, { x: 1150, duration: 0.2, ease: "power3.in", immediateRender: false }, 0.5);
      // Horloge : cercle tracé, puis demi-tour or pendant « 30 MINUTES »
      show("#a2-clock", 0.62);
      tl.fromTo("#a2-clock-c", { strokeDashoffset: 578.1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.62);
      tl.fromTo("#a2-clock-a", { strokeDashoffset: 289.0 }, { strokeDashoffset: 0, duration: 0.9, ease: "none" }, 0.965);
      tl.fromTo("#a2-clock-n", { rotation: 0, svgOrigin: "112.0 112.0" }, { rotation: 180, svgOrigin: "112.0 112.0", duration: 0.9, ease: "none" }, 0.965);
      // P5 : « UNE BOISSON » puis « TOUTES LES 30 MINUTES. »
      fall("#a2-g1-t", 0.455);
      hide("#a2-g1", 0.965);
      fall("#a2-g2a-t", 0.965);
      fall("#a2-g2b-t", 1.045);
      window.__timelines["s02"] = tl;
      </script>
