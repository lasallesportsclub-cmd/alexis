.fr {

  --muted: rgba(244,241,236,0.62); --ghost: rgba(184,160,126,0.16); --hair: rgba(244,241,236,0.18);

  background: var(--canvas); color: var(--text);
  font-family: "Barlow Condensed", sans-serif; font-kerning: normal;
}
.fr.p45 { height: 1350px; }
.fr * { margin: 0; padding: 0; box-sizing: border-box; }
.fr .a { position: absolute; }

/* Typographie */
.fr .disp  { font-weight: 900; font-size: 168px; line-height: .86; letter-spacing: -.01em; text-transform: uppercase; white-space: nowrap; }
.fr .h1    { font-weight: 900; font-size: 112px; line-height: .9;  letter-spacing: -.005em; text-transform: uppercase; white-space: nowrap; }
.fr .h2    { font-weight: 800; font-size: 76px;  line-height: .95; text-transform: uppercase; white-space: nowrap; }
.fr .label { font-weight: 800; font-style: italic; font-size: 44px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; line-height: 1; }
.fr .qual  { font-weight: 800; font-size: 36px; letter-spacing: .03em; text-transform: uppercase; line-height: 1.15; white-space: nowrap; }
.fr .body  { font-family: "DM Sans", sans-serif; font-weight: 500; font-size: 36px; line-height: 1.3; }
.fr .num   { font-variant-numeric: tabular-nums; }
.fr .gold  { color: var(--gold); }
.fr .muted { color: var(--muted); }

/* Pastille or, extrémités coupées à 0,42 (64 px de haut → 27 px) */
.fr .pastille {
  height: 64px; padding: 0 46px; background: var(--gold); color: var(--canvas);
  font-weight: 800; font-style: italic; font-size: 36px; letter-spacing: .02em; text-transform: uppercase;
  display: flex; align-items: center; white-space: nowrap;
  clip-path: polygon(27px 0, 100% 0, calc(100% - 27px) 100%, 0 100%);
}

/* Bande : surface #222, extrémité droite coupée à 0,42, filet or sur le bord d'attaque (style inline : --h, --d = 0.42 × h) */
.fr .bande { background: var(--surface); clip-path: polygon(0 0, 100% 0, calc(100% - var(--d)) 100%, 0 100%); }
.fr .filet { background: var(--gold); clip-path: polygon(calc(100% - 6.5px) 0, 100% 0, calc(100% - var(--d)) 100%, calc(100% - var(--d) - 6.5px) 100%); }
.fr .bande .label { position: absolute; left: 36px; top: 50%; transform: translateY(-52%); }

/* « + » Premium : SVG deux barres, barre verticale penchée à 0,42 */
.fr .plus { fill: var(--gold); overflow: visible; }

/* Panneau des mentions : fond opaque, DM Sans 500 40 px */
.fr .mention {
  left: 108px; width: 864px; background: var(--surface); color: var(--text);
  font-family: "DM Sans", sans-serif; font-weight: 500; font-size: 40px; line-height: 1.18; letter-spacing: -.012em;
  padding: 8px 22px;
}

/* Grain fin, gris, en incrustation : garde la valeur moyenne du fond (#0D0D0D) ; amplitude ≈ ±0,014 */
.fr::after {
  content: "";
  position: absolute; inset: 0; pointer-events: none; opacity: .7; mix-blend-mode: overlay; z-index: 90;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n' color-interpolation-filters='sRGB'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}


.layer { position: absolute; inset: 0; }
.mask { position: absolute; overflow: hidden; padding: 0.2em 0.06em 0.08em 0; margin-top: -0.2em; }
.mask > div { display: block; }
.fr.ov { background: transparent; }
.fr.ov::after { display: none; }
