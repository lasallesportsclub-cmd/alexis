<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0D0D0D; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0D0D0D; }
      [data-composition-id="main"] > div[data-composition-src] { position: absolute; inset: 0; }

.fond { position: absolute; inset: 0; background: #0D0D0D; overflow: hidden; }
.fond .b { position: absolute; top: 0; height: 100%; background: rgba(244,241,236,.022); }
.fond::after { content: ""; position: absolute; inset: 0; opacity: .7; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n' color-interpolation-filters='sRGB'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

    </style>
  </head>
  <body>
    <!-- Story courte B du lancement Visbody : 5 scènes en coupes franches, 10 s, 60 i/s, 120 BPM -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920" data-fps="60">
      <div id="h-b1" data-composition-id="b1" data-composition-src="compositions/b1.html" data-start="0" data-duration="2" data-track-index="1" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="h-b2" data-composition-id="b2" data-composition-src="compositions/b2.html" data-start="2" data-duration="3" data-track-index="2" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="h-b3" data-composition-id="b3" data-composition-src="compositions/b3.html" data-start="5" data-duration="1.5" data-track-index="1" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="h-b4" data-composition-id="b4" data-composition-src="compositions/b4.html" data-start="6.5" data-duration="1.5" data-track-index="2" data-width="1080" data-height="1920" style="z-index:4"></div>
      <div id="h-b5" data-composition-id="b5" data-composition-src="compositions/b5.html" data-start="8" data-duration="2" data-track-index="1" data-width="1080" data-height="1920" style="z-index:5"></div>
      <audio id="musique" src="assets/audio/musique.wav" data-start="0" data-duration="10" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
